services:
  db:
    image: postgres:16-alpine
    container_name: ivr-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ivr
      POSTGRES_USER: ivr
      POSTGRES_PASSWORD: ${IVR_DB_PASSWORD:?Set IVR_DB_PASSWORD in .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - ivr_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ivr -d ivr"]
      interval: 5s
      timeout: 3s
      retries: 10

  web:
    image: nginx:1.27-alpine
    container_name: ivr-webgl
    restart: unless-stopped
    ports:
      - "127.0.0.1:8081:80"
    volumes:
      - ../Unity_WEB_A_IVR/WebGLBuild:/usr/share/nginx/html:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/ || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  ivr_postgres_data:
