services:
  finstory:
    build:
      context: ../FinStory_service
    container_name: ivr-finstory
    restart: unless-stopped
    environment:
      FINSTORY_DEMO: ${FINSTORY_DEMO:-1}
      FINSTORY_INTERNAL_TOKEN: ${FINSTORY_INTERNAL_TOKEN:?Set FINSTORY_INTERNAL_TOKEN in .env}
      YANDEX_API_KEY: ${YANDEX_API_KEY:-}
      YANDEX_FOLDER_ID: ${YANDEX_FOLDER_ID:-}
      FINSTORY_YANDEX_MODEL: ${FINSTORY_YANDEX_MODEL:-aliceai-llm}
      FINSTORY_TERM_MODEL: ${FINSTORY_TERM_MODEL:-0}
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/internal/v1/health', timeout=3)"]
      interval: 5s
      timeout: 4s
      retries: 12

  db:
    image: postgres:16-alpine
    container_name: ivr-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ivr
      POSTGRES_USER: ivr
      POSTGRES_PASSWORD: ${IVR_DB_PASSWORD:?Set IVR_DB_PASSWORD in .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - ivr_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ivr -d ivr"]
      interval: 5s
      timeout: 3s
      retries: 10

  web:
    image: nginx:1.27-alpine
    container_name: ivr-webgl
    restart: unless-stopped
    ports:
      - "127.0.0.1:8081:80"
    volumes:
      - ../Unity_WEB_A_IVR/WebGLBuild:/usr/share/nginx/html:ro
      - ./nginx-webgl.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/ || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  ivr_postgres_data:
