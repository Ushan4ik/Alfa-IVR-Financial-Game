# Локальная разработка — H2 в памяти, Supabase не нужен
spring.config.import=optional:file:.env[.properties]
spring.datasource.url=jdbc:h2:mem:ivrdb;NON_KEYWORDS=DAY
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.flyway.enabled=false
spring.h2.console.enabled=true

# При обычном запуске из IDE персональные уроки используют локальный FinStory.
ml.service.url=${ML_SERVICE_URL:http://127.0.0.1:8000}
learning.finstory.url=${FINSTORY_URL:}
learning.finstory.token=${FINSTORY_INTERNAL_TOKEN:}

logging.level.com.example.demo=DEBUG
logging.level.org.springframework.security=DEBUG
# Override the explicit dialect inherited from application.properties as well.
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
