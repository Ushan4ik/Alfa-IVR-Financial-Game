# Local PostgreSQL. Start with spring.profiles.active=local and export .env first.
spring.config.import=optional:file:.env[.properties]
spring.datasource.url=jdbc:postgresql://localhost:5432/ivr
spring.datasource.username=ivr
spring.datasource.password=${IVR_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
security.bootstrap-admin-emails=${IVR_ADMIN_EMAILS:}
ml.service.url=${ML_SERVICE_URL:http://127.0.0.1:8000}
learning.finstory.url=${FINSTORY_URL:}
learning.finstory.token=${FINSTORY_INTERNAL_TOKEN:}
