spring.application.name=ivr-backend

# Secrets are supplied through environment variables. The fallback is suitable
# only for local development and automated tests.
jwt.secret=${JWT_SECRET:local-development-secret-change-before-deploying}

security.bootstrap-admin-emails=${IVR_ADMIN_EMAILS:}
ml.service.url=${ML_SERVICE_URL:http://localhost:8000}

# FinStory is an internal service. Leave URL blank to keep deterministic fallback lessons.
learning.finstory.url=${FINSTORY_URL:}
learning.finstory.token=${FINSTORY_INTERNAL_TOKEN:}

# Gemini is optional. Without a key the server uses its deterministic fallback.
learning.gemini.key=${GEMINI_API_KEY:}
learning.gemini.model=${GEMINI_MODEL:}
spring.task.scheduling.pool.size=2
app.daily-zone=${DAILY_ZONE:Europe/Moscow}
