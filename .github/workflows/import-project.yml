name: Import project sources

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack committed project
        run: |
          cat alfa-ivr-project.part-* > /tmp/alfa-ivr-project.tar.gz
          tar -xzf /tmp/alfa-ivr-project.tar.gz
          rm -f alfa-ivr-project.part-*
          rm -f .github/workflows/import-project.yml
      - name: Commit imported sources
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Import Unity and Spring project sources"
          git push
